name: Deployment mohdamzar

on:
  push:
    branches: [ master ]

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/mohdamzar-website
        tags: |
          type=sha,prefix=,format=short

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}

  update-gitops:
    name: Update argocd-gitops
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Checkout argocd-gitops
      uses: actions/checkout@v4
      with:
        repository: amzar96/argocd-gitops
        token: ${{ secrets.GH_PAT }}

    - name: Update image tag
      run: |
        sed -i "s|image: ghcr.io/amzar96/mohdamzar-website:.*|image: ghcr.io/amzar96/mohdamzar-website:${{ needs.build-and-push.outputs.image_tag }}|" \
          clusters/homelab/website/deployment.yaml

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add clusters/homelab/website/deployment.yaml
        git commit -m "chore: update mohdamzar-website to ${{ needs.build-and-push.outputs.image_tag }}"
        git push
